<div id="form-main">
     <div id="form-container">
        <h2>Enter Details / ಮಾಹಿತಿ  ದಾಖಲಿಸಿ </h2>
        <form id="registForm">
            <label for="name">Child Name/ ಮಗುವಿನ ಹೆಸರು <span>*</span></label>
            <input type="text" name="name" id="name" minlength="2" maxlength="50" required>

            <label for="phone">Phone Number/ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ <span>*</span> </label>
            <input type="tel" id="phone" name="phone" pattern="[6-9][0-9]{9}" maxlength="13" required>

            <label for="fname">Father Name / ತಂದೆಯ ಹೆಸರು <span>*</span> </label>
            <input type="text" name="fname" id="phone" required>

            <label for="mname">Mother Name/ ತಾಯಿಯ  ಹೆಸರು <span>*</span> </label>
            <input type="text" name="mname" id="mname" required>

             <label for="age">Enter Age/ ವಿದ್ಯಾರ್ಥಿಯ ವಯಸ್ಸು <span>*</span></label>
            <input type="number" name="age" id="age" min="3" max="30" required>

            <label for="address">Enter Address/ ವಿದ್ಯಾರ್ಥಿಯ ವಿಳಾಸ <span>*</span> </label>
            <textarea name="address" id="address" required

                <option value="4th">4th Standard/ ನಾಲ್ಕನೇ ತರಗತಿ</option>
                <option value="fifth">5th Standard/ ಐದನೇ ತರಗತಿ</option>
                <option value="6th">6th Standard/ ಆರನೇ  ತರಗತಿ</option>
                <option value="7th">7th Standard/ ಏಳನೇ ತರಗತಿ</option>

                <option value="9th">9th Standard/ ಒಂಬತ್ತನೇ ತರಗತಿ</option>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
    AOS.init();


    const translations={
        en: {
            title: "Gurukula",

            subtitle: `Bala Samskara Kendra <br> Kinnipadavu, Bajpe`,

            home: "Home",

            about: "About Us",
             
            contact: "Contact Us",

            welcome: "Welcome to Gurukula",

           bala: "Bala Samskara Kendra",

           location: "Kinnipadavu, Bajpe"
    
    },

    kn:{

        title: "ಗುರುಕುಲ",

        subtitle: `ಬಾಲ ಸಂಸ್ಕಾರ ಕೇಂದ್ರ <br> ಕಿನ್ನಿಪದವು ಬಜ್ಪೆ`,

        home: "ಮುಖಪುಟ",

        about: "ನಮ್ಮ ಬಗ್ಗೆ"
    }
   
   };  

   const langselect = document.getElementById("langselect");

function changeLanguage(langauge){
    document.querySelectorAll("[data-key]").forEach(function(element){
        const key= element.getAttribute("data-key");


        if (translations[langauge][key]){
            element.innerHTML=translations[langauge][key];
        }
    });

    localStorage.setItem("selectedLangauge",langauge);
}

langselect.addEventListener("change",function(){
    changeLanguage(this.value);
});

const savedLanguage=localStorage.getItem("selectedLangauge");


if (savedLanguage){
    langselect.value=savedLanguage;
    changeLanguage(savedLanguage);

} else{
    langselect.value="en";
    changeLanguage("en");
}

</script>

<script>
  
// Get the form
const form = document.getElementById("registrationForm");


form.addEventListener("submit", async function(event) {

    // Stop normal form submission
    event.preventDefault();


    const name = document.getElementById("name").value.trim();

    const phone = document.getElementById("phone").value.trim();

    const fatherName = document.getElementById("fname").value.trim();

    const motherName = document.getElementById("mname").value.trim();

    const age = document.getElementById("age").value;

    const address = document.getElementById("address").value.trim();

    const className = document.getElementById("class").value;

    const schoolName = document.getElementById("schoolname").value.trim();


   

    const formData = {

        name: name,

        phone: phone,

        fatherName: fatherName,

        motherName: motherName,

        age: age,

        address: address,

        className: className,

        schoolName: schoolName

    };


    // Check data in browser console
    console.log("Form Data:", formData);


    try {

        const response = await fetch("/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(formData)

        });


        // Convert server response to JavaScript object
        const result = await response.json();


     
        if (response.ok) {

            alert("Registration successful!");


            // Clear form
            form.reset();


        } else {

            alert(
                result.message ||
                "Registration failed. Please try again."
            );

        }


    } catch (error) {

        // If backend cannot be reached show err
        console.error("Error:", error);

        alert(
            "Unable to connect to the server. " +
            "Please make sure the backend is running."
        );

    }

});
</script>
