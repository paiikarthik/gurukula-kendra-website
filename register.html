   const langselect = document.getElementById("langselect");

function changeLanguage(langauge){
    document.querySelectorAll("[data-key]").forEach(function(element){
        const key= element.getAttribute("data-key");


        if (translations[langauge][key]){
            element.innerHTML=translations[langauge][key];
        }
    });

    localStorage.setItem("selectedLangauge",langauge);
}

langselect.addEventListener("change",function(){
    changeLanguage(this.value);
});

const savedLanguage=localStorage.getItem("selectedLangauge");


if (savedLanguage){
    langselect.value=savedLanguage;
    changeLanguage(savedLanguage);

} else{
    langselect.value="en";
    changeLanguage("en");
}
